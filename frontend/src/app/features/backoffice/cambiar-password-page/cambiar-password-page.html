<header class="login__head bc-reveal">
  <span class="bc-eyebrow">Antes de continuar</span>
  <h2>Cambia tu contraseña</h2>
  <p>Por seguridad, debes reemplazar tu contraseña temporal antes de usar el backoffice.</p>
</header>

<form [formGroup]="form" (ngSubmit)="enviar()" novalidate class="bc-reveal">
  <label class="campo" [class.campo--error]="invalido('actual')">
    <span class="campo__label">Contraseña actual</span>
    <input formControlName="actual" type="password" autocomplete="current-password" />
  </label>

  <label class="campo" [class.campo--error]="invalido('nueva')">
    <span class="campo__label">Nueva contraseña</span>
    <input formControlName="nueva" type="password" autocomplete="new-password" />
    <span class="campo__hint">Mínimo 12 caracteres.</span>
  </label>

  <label class="campo" [class.campo--error]="invalido('confirmar') || form.hasError('noCoincide')">
    <span class="campo__label">Confirmar nueva contraseña</span>
    <input formControlName="confirmar" type="password" autocomplete="new-password" />
    @if (form.hasError('noCoincide') && form.get('confirmar')?.touched) {
      <span class="campo__hint campo__hint--error">Las contraseñas no coinciden.</span>
    }
  </label>

  @if (errorServidor()) {
    <p class="login__error" role="alert">{{ errorServidor() }}</p>
  }

  <div class="login__acciones">
    <button type="submit" class="bc-btn bc-btn--primary" [disabled]="enviando()">
      {{ enviando() ? 'Guardando…' : 'Cambiar contraseña' }}
      <span class="bc-btn__icon" aria-hidden="true">→</span>
    </button>
  </div>
</form>
