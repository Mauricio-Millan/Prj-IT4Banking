name: Trigger auto deployment for ca-bancocloud-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-bancocloud-api-AutoDeployTrigger-d382cef0-5833-4f6a-82ae-b6fd5543ed18.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrbancocloud.azurecr.io
          registryUsername: ${{ secrets.CABANCOCLOUDAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CABANCOCLOUDAPI_REGISTRY_PASSWORD }}
          containerAppName: ca-bancocloud-api
          resourceGroup: rg-bancocloud
          imageToBuild: acrbancocloud.azurecr.io/ca-bancocloud-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


