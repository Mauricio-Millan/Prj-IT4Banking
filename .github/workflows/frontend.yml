name: frontend

on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 17 specs preexistentes fallan por falta de provideHttpClient() en su
      # TestBed (no relacionado a este cambio). No bloquea el deploy hasta
      # que se corrijan; el resultado queda igual en el resumen del run.
      - run: npx ng test --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - run: npx ng build --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, bancocloud]
    environment:
      name: dev
      url: https://stbancocloudweb.z20.web.core.windows.net/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Subir a Azure Storage Static Website
        run: |
          az storage blob upload-batch \
            --account-name stbancocloudweb -d '$web' -s dist \
            --overwrite --auth-mode key
