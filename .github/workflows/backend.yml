name: backend

# Solo gate de PR/push: valida el codigo. El despliegue real a dev vive
# unicamente en ca-bancocloud-api-AutoDeployTrigger-*.yml (OIDC, sin runner
# self-hosted). Antes este workflow tenia su propio job "deploy" corriendo
# en paralelo al OIDC contra el mismo Container App -- dos caminos para el
# mismo recurso, uno de ellos (el OIDC) sin gate de test. Ver
# Docs/ci-cd-estrategia.md #1.2.

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # conftest.py fija DATABASE_URL=sqlite:// y las claves de prueba: no hace falta
      # SQL Server ni Alembic aqui, los tests corren contra SQLite en memoria.
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  # Despliegue a QA, solo a demanda (decision del equipo: no en cada push a
  # develop). Reusa la identidad OIDC del Deployment Center: tiene Contributor
  # a nivel del resource group completo, asi que alcanza tambien a
  # ca-bancocloud-api-test sin crear ninguna identidad nueva.
  deploy-test:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: test
      url: https://ca-bancocloud-api-test.ashyrock-5daec08d.canadacentral.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CABANCOCLOUDAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build y push de la imagen (az acr build)
        run: az acr build -r acrbancocloud -t bancocloud/backend:${{ github.sha }}-test backend

      - name: Actualizar Container App de test
        run: |
          az containerapp update \
            -g rg-bancocloud -n ca-bancocloud-api-test \
            --image acrbancocloud.azurecr.io/bancocloud/backend:${{ github.sha }}-test

      - name: Verificar que el API de test responde (smoke test)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ca-bancocloud-api-test.ashyrock-5daec08d.canadacentral.azurecontainerapps.io/openapi.json)
            [ "$code" = "200" ] && echo "OK: API de test responde (200)" && exit 0
            sleep 10
          done
          echo "::error::El API de test no respondio 200 tras el despliegue"
          exit 1
