# Desarrollo local: SQL Server 2022 Express (mismo motor T-SQL que Azure SQL).
# Uso: docker compose up -d   →   DATABASE_URL=mssql+pyodbc://sa:BancoCloud!Local1@localhost:1433/bancocloud?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "BancoCloud!Local1"   # solo local; en Azure la clave vive en Key Vault
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
